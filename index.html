<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#052b69">
  <meta name="description" content="Presentación de Ingeniería en Ciencias de la Computación de la UPS, sede Cuenca.">
  <title>Ingeniería en Ciencias de la Computación | UPS Cuenca</title>
  <link rel="stylesheet" href="css/presentation.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/presentation.js"></script>
</head>
<body>
  <header class="toolbar" aria-label="Controles de presentación">
    <button class="control-button" id="previous-slide" type="button" aria-label="Diapositiva anterior">Anterior</button>
    <output class="slide-counter" id="slide-counter" aria-live="polite">1 / 3</output>
    <button class="control-button" id="next-slide" type="button" aria-label="Siguiente diapositiva">Siguiente</button>
    <button class="control-button control-button--yellow" id="download-pdf" type="button">Exportar a PDF</button>
    <span class="download-status" id="download-status" role="status" aria-live="polite"></span>
  </header>
  <main class="deck" id="presentation" aria-label="Presentación de la carrera"></main>
</body>
</html>
